# Approves and queues patch and minor Dependabot updates for this repo; majors
# are labelled needs-manual-review and left for a human.
#
# Needs "Allow auto-merge" enabled on the repo and the CI jobs marked as
# required checks. Auto-merge only waits on checks a ruleset requires, so with
# nothing required there is nothing for it to wait on.
# Trigger is pull_request, not pull_request_target. This repository is public,
# so anyone can open a pull request; pull_request_target would run them in the
# base-branch context with a write token. It buys nothing here either - either
# trigger still needs an opened/synchronize/reopened event to fire.
name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide eligibility
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
        run: |
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch) eligible=true ;;
            version-update:semver-minor) eligible=true ;;
          esac
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "update=$UPDATE_TYPE dep=$DEP_TYPE eligible=$eligible"

      - name: Approve and enable auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"

      - name: Label held pull requests
        if: steps.gate.outputs.eligible != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_URL" --add-label "needs-manual-review" || true
