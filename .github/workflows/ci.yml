# Gates pull requests so dependency updates cannot land unverified.
#
# Every job runs on every pull request on purpose: a job skipped by a path
# filter never reports a status, and a required check that never reports blocks
# the pull request forever.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-agent-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crawler-agent-core/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-agent-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: crawler-agent-fe/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint

  fastly:
    name: fastly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fastly/package-lock.json
      - run: npm ci
      - run: npx --yes @fastly/cli@17.0.0 compute build --non-interactive
      # The local server can't verify tokens (no HTTP cache API), so this only
      # proves the worker boots and answers a request without one.
      - name: Smoke test
        run: |
          npx --yes @fastly/cli@17.0.0 compute serve --skip-build --addr 127.0.0.1:7676 > serve.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:7676/ && break
            if ! kill -0 "$server" 2>/dev/null; then
              echo "Local server exited before answering"
              cat serve.log
              exit 1
            fi
            sleep 2
          done

          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7676/)
          if [ "$status" != "403" ]; then
            echo "Expected 403 for a request without a token, got $status"
            exit 1
          fi
