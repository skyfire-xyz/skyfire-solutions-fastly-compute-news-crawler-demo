version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/crawler-agent-core'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      core-dev:
        dependency-type: 'development'
        update-types: ['patch', 'minor']
      core-prod:
        dependency-type: 'production'
        update-types: ['patch']

  - package-ecosystem: 'npm'
    directory: '/crawler-agent-fe'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      fe-dev:
        dependency-type: 'development'
        update-types: ['patch', 'minor']
      fe-prod:
        dependency-type: 'production'
        update-types: ['patch']

  - package-ecosystem: 'npm'
    directory: '/fastly'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      fastly-dev:
        dependency-type: 'development'
        update-types: ['patch', 'minor']
      fastly-prod:
        dependency-type: 'production'
        update-types: ['patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: ['patch', 'minor']
